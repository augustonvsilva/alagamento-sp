<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Alerta Alagamento SP</title>
  <meta name="description" content="Previsão de alagamentos em São Paulo com o histórico do CGE e a previsão do tempo." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌧️</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; }
    #carregando { position: fixed; inset: 0; z-index: 100000; background: #fff; display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: .8rem; color: #1f4e79; text-align: center; padding: 1rem; }
    #carregando h1 { margin: 0; font-size: 1.6rem; }
    #carregando p { margin: 0; color: #555; max-width: 32rem; line-height: 1.4; }
    #carregando #status { color: #1f4e79; font-weight: 600; }
    #tentar { font: inherit; font-weight: 600; color: #fff; background: #1f4e79; border: 0;
              border-radius: .5rem; padding: .7rem 1.4rem; margin-top: .5rem; }
    .gota { font-size: 3rem; animation: cair 1.2s ease-in-out infinite; }
    @keyframes cair { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(10px) } }
  </style>
</head>
<body>
  <div id="carregando">
    <div class="gota">🌧️</div>
    <h1>Alerta Alagamento SP</h1>
    <p id="status"></p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

    const arquivos = [
      "app.py",
      "src/__init__.py", "src/config.py", "src/features.py", "src/geo.py", "src/grade.py",
      "src/nomes.py", "src/risk.py", "src/servico.py", "src/ui.py", "src/weather.py",
      "paginas/visao_geral.py", "paginas/minha_regiao.py", "paginas/trajeto.py",
      "paginas/analise.py", "paginas/modelo.py",
      "models/modelo.json", "models/metricas.json",
      "data/processed/alagamentos_geo.parquet", "data/processed/celulas.parquet",
      "data/processed/diario.parquet", "data/processed/pontos.parquet",
    ];
    // Pasta base do site. No GitHub Pages de projeto é "/<repositório>/"; localmente, "/".
    // Necessário porque o app muda a URL (ex.: /alagamento-sp/trajeto) e o 404.html,
    // cópia desta página, é servido nessas sub-URLs ao recarregar.
    const partes = location.pathname.split("/");
    const base = location.hostname.endsWith("github.io") && partes.length > 2 ? `/${partes[1]}/` : "/";
    const files = Object.fromEntries(arquivos.map((f) => [f, { url: new URL(base + f, location.origin).href }]));

    // Sub-URL (ex.: /alagamento-sp/trajeto) -> volta para a base e pede a página via ?pagina=
    const resto = location.pathname.slice(base.length).replace(/\/$/, "");
    const subpagina = resto && !["index.html", "404.html"].includes(resto);
    const params = new URLSearchParams(location.search);
    if (subpagina) params.set("pagina", resto);

    // Localização do aparelho: pedida logo na abertura. Com ela, o app abre direto em
    // "Minha região" mostrando o risco na área da pessoa (?lat=..&lon=.., lidos no app.py).
    const status = document.getElementById("status");
    const posicao = await new Promise((ok) => {
      if (!navigator.geolocation) return ok(null);
      const limite = setTimeout(() => ok(null), 30000);  // não trava o app se ninguém responder
      navigator.geolocation.getCurrentPosition(
        (p) => { clearTimeout(limite); ok(p.coords); },
        () => { clearTimeout(limite); ok(null); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 300000 },
      );
    });
    if (posicao) {
      params.set("lat", posicao.latitude.toFixed(5));
      params.set("lon", posicao.longitude.toFixed(5));
      if (!subpagina) params.set("pagina", "minha_regiao");
    }
    const busca = params.toString();
    history.replaceState(null, "", `${base}${busca ? "?" + busca : ""}`);

    // Internet fraca: o download de algum pacote Python (ex.: pandas, o maior) pode falhar e o
    // app quebra com ModuleNotFoundError. Recarrega sozinho (o que já baixou fica em cache);
    // depois de 2 tentativas, mostra um botão para tentar de novo.
    const TENTATIVAS = "alagamento-tentativas";
    const lerTentativas = () => { try { return +sessionStorage.getItem(TENTATIVAS) || 0; } catch { return 0; } };
    const gravarTentativas = (n) => { try { sessionStorage.setItem(TENTATIVAS, n); } catch {} };
    function falhaNoDownload() {
      const n = lerTentativas();
      // No app Android, apaga o cache antes (o pacote pode ter ficado corrompido no cache)
      const recarregar = () => {
        try { window.AppAndroid?.limparCache(); } catch {}
        setTimeout(() => location.replace(base), 800);
      };
      if (n < 2) {
        gravarTentativas(n + 1);
        status.textContent = "Alguns componentes não baixaram direito. Tentando de novo…";
        recarregar();
        return;
      }
      gravarTentativas(0);
      const tela = document.createElement("div");
      tela.id = "carregando";
      tela.innerHTML = `<div class="gota">📶</div><h1>Conexão instável</h1>
        <p>Não conseguimos baixar todos os componentes do app. Verifique sua internet e tente de novo.</p>
        <button id="tentar">Tentar novamente</button>`;
      document.body.append(tela);
      document.getElementById("tentar").onclick = recarregar;
    }

    const observer = new MutationObserver(() => {
      const erro = document.querySelector("[data-testid='stException']");
      if (erro && /ModuleNotFoundError/.test(erro.textContent)) {
        observer.disconnect();
        falhaNoDownload();
        return;
      }
      // Some só quando a página de verdade aparece (título ou erro), não no esqueleto do stlite
      if (document.querySelector("[data-testid='stHeading'], [data-testid='stException'], [data-testid='stAlert']")) {
        document.getElementById("carregando")?.remove();
        gravarTentativas(0);
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("root"), { childList: true, subtree: true });
    setTimeout(() => {
      if (document.getElementById("carregando")) {
        status.textContent = "Está demorando mais que o normal… Confira sua conexão com a internet.";
      }
    }, 240000);

    mount({
      requirements: ["folium", "requests", "tzdata"],
      entrypoint: "app.py",
      files,
      streamlitConfig: {
        "theme.primaryColor": "#1f4e79",
        "theme.backgroundColor": "#ffffff",
        "theme.secondaryBackgroundColor": "#f2f5f9",
        "theme.textColor": "#1b1f24",
        "client.toolbarMode": "viewer",
      },
    }, document.getElementById("root"));
  </script>
</body>
</html>
